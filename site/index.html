<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科研图库</title>
  <meta name="description" content="个人科研图库：每张图都有原图、可执行样式与代码、数据契约和验证记录，按 ID 复用。">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1517" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply a saved theme before first paint (per-viewer preference only).
    try { var t = JSON.parse(localStorage.getItem("figlib.theme")); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到内容</a>
  <header id="topbar" class="topbar"></header>
  <div id="banner"></div>
  <main id="main" tabindex="-1"><div class="loading"><div class="spinner"></div></div></main>
  <div id="footer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">浏览图库需要启用 JavaScript。条目原始文件也可直接在 GitHub 仓库中查看。</p></noscript>
</body>
</html>

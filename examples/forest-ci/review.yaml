  summary: 检查标签—区间—数值三列的行对齐、标题与边距、对数刻度和基准线 1。PNG 与 PDF 中未见文字裁切或遮挡；SVG 保留文字和矢量图元。
- kind: data
  summary: 8 行主输入均为正比值，区间包含估计值；Habits 与 Context 的颜色按组名绑定。数据和区间都是明确标注的人工合成示例，没有统计模型、p
    值或置信覆盖率声明。
- kind: changed-input
  summary: 使用 data/alternative.csv 将 8 行改为 10 行，替换数值、加长标签并改变组别顺序。实际运行且查看输出，换行、列对齐和组别颜色保持一致；run
    记录为同一绘图实现/样式、不同 CSV 摘要。 预览另存 review/evidence/changed-input.png，其字节摘要与证据清单中的 figure.png
    一致。
